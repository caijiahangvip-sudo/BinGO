[package]
name = "bingo-teacher"
version = "1.0.0"
description = "BinGO Teacher desktop client"
authors = ["BinGO contributors"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bingo_teacher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-single-instance = "2"
