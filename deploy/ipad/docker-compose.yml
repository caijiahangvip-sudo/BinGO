services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bingo
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: ${BINGO_POSTGRES_PASSWORD}
    volumes:
      - bingo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo -d bingo"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${BINGO_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${BINGO_MINIO_PASSWORD}
    volumes:
      - bingo-media:/data

  sync:
    build:
      context: ../..
      dockerfile: packages/sync-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BINGO_DATABASE_URL: postgres://bingo:${BINGO_POSTGRES_PASSWORD}@postgres:5432/bingo
      BINGO_TOKEN_SECRET: ${BINGO_TOKEN_SECRET}
      BINGO_BOOTSTRAP_ADMIN_EMAIL: ${BINGO_BOOTSTRAP_ADMIN_EMAIL}
      BINGO_BOOTSTRAP_ADMIN_PASSWORD: ${BINGO_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:4100:4100"
      - "127.0.0.1:4101:4101"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - sync
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bingo-postgres:
  bingo-media:
