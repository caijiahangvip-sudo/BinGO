name: BinGO
options:
  bundleIdPrefix: app.bingo
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
targets:
  BinGO:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Networking
      - path: Persistence
      - path: Services
      - path: Views
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bingo.ipad
        DEVELOPMENT_TEAM: P9PRUSZAS6
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/BinGO.entitlements
        PRODUCT_NAME: BinGO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - BinGOTests
  BinGOTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BinGO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bingo.ipad.tests
